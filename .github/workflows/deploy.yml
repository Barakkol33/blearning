name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Picks up changes in the openu repo, which is generated into the site at build time.
  schedule:
    - cron: '0 3 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      OPENU_DIR: ../openu
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: Barakkol33/openu
          path: openu
      - uses: withastro/action@v5
        with:
          path: ./site
          node-version: 24
          # Astro's content cache keeps rendered Markdown, and it does not notice changes to the
          # Markdown config (e.g. heading links). The build is fast, so always build fresh.
          cache: false

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
