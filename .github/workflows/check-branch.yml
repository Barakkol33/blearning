name: Check branch build
on:
  push:
    branches-ignore: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      OPENU_DIR: ../openu
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: Barakkol33/openu
          path: openu
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci && npm run build
        working-directory: site
      - name: Show area indexes
        working-directory: site/dist
        run: |
          for f in */index.html; do
            grep -q 'bl-area-index' "$f" || continue
            python3 -c "import re,sys,html;s=open(sys.argv[1]).read();m=re.search(r'<nav class=.bl-area-index.*?</nav>',s,re.S).group(0);m=re.sub(r'<li[^>]*>','\\n- ',m);t=html.unescape(re.sub(r'<[^>]+>','',m))[:3000];print('::notice title='+sys.argv[1]+'::'+t.replace(chr(10),'%0A'))" "$f"
          done
