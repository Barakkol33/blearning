# The game in the cluster, as code: 3 copies of it, and one address in front of them.
#
#   Deployment - "always keep 3 copies of the game-site image running"
#   Service    - one stable address that spreads players over the copies (the load balancer)
#
# The image itself (game-site:v1) is built from game/ by ./demo.sh up, and newer versions
# by the pipeline (./demo.sh update).
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: game
spec:
  replicas: 3                       # the desired state: how many copies
  selector:
    matchLabels:
      app: game
  strategy:
    rollingUpdate:
      maxUnavailable: 0             # never go below 3 healthy copies during an update
      maxSurge: 1                   # add one new copy at a time
  template:
    metadata:
      labels:
        app: game
    spec:
      terminationGracePeriodSeconds: 10
      # high availability: spread the copies over the machines, so losing one machine never loses all of them
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          nodeTaintsPolicy: Honor        # ignore machines that can't take copies (the brain, or one that's down)
          labelSelector:
            matchLabels:
              app: game
      # if a machine disappears, move its copies elsewhere after 5s (the default is 5 minutes)
      tolerations:
        - key: node.kubernetes.io/unreachable
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 5
        - key: node.kubernetes.io/not-ready
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 5
      containers:
        - name: web
          image: game-site:v1         # built on this laptop and loaded into the cluster - no registry
          imagePullPolicy: Never      # never download it: it's already on every machine
          ports:
            - containerPort: 80
          env:                        # the version and color are inside the image; these say who answered
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          readinessProbe:           # only send players to a copy that answers
            httpGet:
              path: /healthz
              port: 80
            periodSeconds: 1
          lifecycle:
            preStop:                # finish in-flight requests before shutting down
              exec:
                command: ["sleep", "3"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: game
spec:
  type: NodePort
  selector:
    app: game
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
