  <text x="475" y="266" text-anchor="middle" font-size="20" fill="#242424">email consumer has read up to here</text>
  <line x1="1035" y1="240" x2="1035" y2="180" stroke="#242424" stroke-width="3" marker-end="url(#a)"/>
