<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" font-family="Segoe UI, Calibri, Carlito, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#ffffff"/>
    </marker>
    <g id="pill">
      <rect x="-62" y="-22" width="124" height="44" rx="22" fill="#ffffff" stroke="#242424" stroke-width="2.5"/>
    </g>
  </defs>
  <rect width="1200" height="400" fill="#ffffff"/>

  <!-- the infinity loop: dev on the left, ops on the right -->
  <path d="M600 190 C 520 60, 220 60, 220 190 C 220 320, 520 320, 600 190" fill="none" stroke="#0f6cbd" stroke-width="28" stroke-linecap="round"/>
  <path d="M600 190 C 680 60, 980 60, 980 190 C 980 320, 680 320, 600 190" fill="none" stroke="#2b579a" stroke-width="28" stroke-linecap="round"/>
  <text x="380" y="206" text-anchor="middle" font-size="46" font-weight="700" fill="#0f6cbd">DEV</text>
  <text x="820" y="206" text-anchor="middle" font-size="46" font-weight="700" fill="#2b579a">OPS</text>

  <!-- the steps, in order around the loop -->
  <use href="#pill" x="507" y="117"/><text x="507" y="125" text-anchor="middle" font-size="21" fill="#242424">1 plan</text>
  <use href="#pill" x="268" y="117"/><text x="268" y="125" text-anchor="middle" font-size="21" fill="#242424">2 code</text>
  <use href="#pill" x="268" y="263"/><text x="268" y="271" text-anchor="middle" font-size="21" fill="#242424">3 build</text>
  <use href="#pill" x="507" y="263"/><text x="507" y="271" text-anchor="middle" font-size="21" fill="#242424">4 test</text>
  <use href="#pill" x="693" y="117"/><text x="693" y="125" text-anchor="middle" font-size="21" fill="#242424">5 release</text>
  <use href="#pill" x="932" y="117"/><text x="932" y="125" text-anchor="middle" font-size="21" fill="#242424">6 deploy</text>
  <use href="#pill" x="932" y="263"/><text x="932" y="271" text-anchor="middle" font-size="21" fill="#242424">7 operate</text>
  <use href="#pill" x="693" y="263"/><text x="693" y="271" text-anchor="middle" font-size="21" fill="#242424">8 monitor</text>

  <text x="600" y="372" text-anchor="middle" font-size="22" fill="#7a7a7a">small changes, many times a day - what you learn in production feeds the next plan</text>
</svg>
