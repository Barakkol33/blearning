<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480" font-family="Segoe UI, Calibri, Carlito, sans-serif">
  <defs>
    <g id="tag"><rect x="-80" y="-22" width="160" height="44" rx="22" fill="#ffffff" stroke="#7a7a7a" stroke-width="2"/></g>
  </defs>
  <rect width="1200" height="480" fill="#ffffff"/>

  <!-- the layer that changes -->
  <rect x="30" y="20" width="1140" height="170" rx="16" fill="#f7f7f7" stroke="#7a7a7a" stroke-width="2.5" stroke-dasharray="10 7"/>
  <text x="56" y="58" font-size="22" font-weight="700" fill="#7a7a7a">today's best practice</text>
  <text x="1144" y="58" text-anchor="end" font-size="20" fill="#7a7a7a">changes every few years</text>
  <use href="#tag" x="160" y="125"/><text x="160" y="132" text-anchor="middle" font-size="20" fill="#242424">Kubernetes</text>
  <use href="#tag" x="340" y="125"/><text x="340" y="132" text-anchor="middle" font-size="20" fill="#242424">Docker</text>
  <use href="#tag" x="520" y="125"/><text x="520" y="132" text-anchor="middle" font-size="20" fill="#242424">Kafka</text>
  <use href="#tag" x="700" y="125"/><text x="700" y="132" text-anchor="middle" font-size="20" fill="#242424">Terraform</text>
  <use href="#tag" x="880" y="125"/><text x="880" y="132" text-anchor="middle" font-size="20" fill="#242424">CI/CD</text>
  <use href="#tag" x="1060" y="125"/><text x="1060" y="132" text-anchor="middle" font-size="20" fill="#242424">AI tools</text>

  <!-- the base that doesn't -->
  <text x="600" y="228" text-anchor="middle" font-size="22" font-weight="700" fill="#0f6cbd">the base - it doesn't change</text>
  <rect x="30" y="245" width="360" height="170" rx="14" fill="#0f6cbd"/>
  <text x="210" y="305" text-anchor="middle" font-size="22" fill="#dbe7f6">1</text>
  <text x="210" y="345" text-anchor="middle" font-size="30" font-weight="700" fill="#ffffff">the product</text>
  <text x="210" y="382" text-anchor="middle" font-size="20" fill="#dbe7f6">what it should do</text>

  <rect x="420" y="245" width="360" height="170" rx="14" fill="#2b579a"/>
  <text x="600" y="305" text-anchor="middle" font-size="22" fill="#dbe7f6">2</text>
  <text x="600" y="345" text-anchor="middle" font-size="30" font-weight="700" fill="#ffffff">your technology</text>
  <text x="600" y="382" text-anchor="middle" font-size="20" fill="#dbe7f6">what it really does</text>

  <rect x="810" y="245" width="360" height="170" rx="14" fill="#1a7f37"/>
  <text x="990" y="305" text-anchor="middle" font-size="22" fill="#d6efdc">3</text>
  <text x="990" y="345" text-anchor="middle" font-size="30" font-weight="700" fill="#ffffff">learning</text>
  <text x="990" y="382" text-anchor="middle" font-size="20" fill="#d6efdc">new tools, all the time</text>

  <text x="990" y="456" text-anchor="middle" font-size="22" font-weight="700" fill="#1a7f37">(always true: learn English well)</text>
</svg>
