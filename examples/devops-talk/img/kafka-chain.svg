<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 220" width="1200" height="220" font-family="Segoe UI, Calibri, Carlito, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#7a7a7a"/>
    </marker>
  </defs>
  <rect width="1200" height="220" fill="#ffffff"/>

  <rect x="15" y="40" width="160" height="68" rx="12" fill="#0f6cbd"/>
  <text x="95" y="82" text-anchor="middle" font-size="21" font-weight="700" fill="#ffffff">checkout</text>
  <line x1="175" y1="74" x2="211" y2="74" stroke="#7a7a7a" stroke-width="3" marker-end="url(#a)"/>

  <rect x="215" y="40" width="160" height="68" rx="12" fill="#eef4fb" stroke="#2b579a" stroke-width="2.5"/>
  <text x="295" y="82" text-anchor="middle" font-size="20" fill="#242424">charge card</text>
  <line x1="375" y1="74" x2="411" y2="74" stroke="#7a7a7a" stroke-width="3" marker-end="url(#a)"/>

  <rect x="415" y="40" width="160" height="68" rx="12" fill="#eef4fb" stroke="#2b579a" stroke-width="2.5"/>
  <text x="495" y="82" text-anchor="middle" font-size="20" fill="#242424">update stock</text>
  <line x1="575" y1="74" x2="611" y2="74" stroke="#7a7a7a" stroke-width="3" marker-end="url(#a)"/>

  <rect x="615" y="40" width="160" height="68" rx="12" fill="#fff6e6" stroke="#d97706" stroke-width="3"/>
  <text x="695" y="82" text-anchor="middle" font-size="20" fill="#242424">send email</text>
  <text x="695" y="140" text-anchor="middle" font-size="19" font-weight="700" fill="#b45309">slow...</text>
  <line x1="775" y1="74" x2="811" y2="74" stroke="#7a7a7a" stroke-width="3" marker-end="url(#a)"/>

  <rect x="815" y="40" width="160" height="68" rx="12" fill="#eef4fb" stroke="#2b579a" stroke-width="2.5"/>
  <text x="895" y="82" text-anchor="middle" font-size="20" fill="#242424">points</text>
  <line x1="975" y1="74" x2="1011" y2="74" stroke="#7a7a7a" stroke-width="3" marker-end="url(#a)"/>

  <rect x="1015" y="40" width="170" height="68" rx="12" fill="#fdf0f0" stroke="#cf222e" stroke-width="3" stroke-dasharray="9 6"/>
  <text x="1100" y="82" text-anchor="middle" font-size="20" fill="#242424">analytics</text>
  <text x="1100" y="140" text-anchor="middle" font-size="19" font-weight="700" fill="#cf222e">down ✕</text>

  <text x="600" y="198" text-anchor="middle" font-size="23" font-weight="700" fill="#cf222e">one slow or broken link - and nobody can buy</text>
</svg>
