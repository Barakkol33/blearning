<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" width="1200" height="330" font-family="Segoe UI, Calibri, Carlito, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#7a7a7a"/>
    </marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#cf222e"/>
    </marker>
  </defs>
  <rect width="1200" height="330" fill="#ffffff"/>

  <!-- the change -->
  <rect x="15" y="40" width="150" height="110" rx="14" fill="#f7f7f7" stroke="#7a7a7a" stroke-width="2.5"/>
  <text x="90" y="88" text-anchor="middle" font-size="21" font-weight="700" fill="#242424">a change</text>
  <text x="90" y="116" text-anchor="middle" font-size="17" fill="#7a7a7a">"release v2"</text>
  <line x1="165" y1="95" x2="203" y2="95" stroke="#7a7a7a" stroke-width="3" marker-end="url(#a)"/>

  <!-- 1 test -->
  <rect x="208" y="40" width="210" height="110" rx="14" fill="#eef4fb" stroke="#0f6cbd" stroke-width="3"/>
  <text x="313" y="78" text-anchor="middle" font-size="22" font-weight="700" fill="#0f6cbd">1 TEST</text>
  <text x="313" y="106" text-anchor="middle" font-size="17" fill="#242424">is the change</text>
  <text x="313" y="128" text-anchor="middle" font-size="17" fill="#242424">valid?</text>
  <line x1="418" y1="95" x2="456" y2="95" stroke="#7a7a7a" stroke-width="3" marker-end="url(#a)"/>

  <!-- 2 deploy: a rolling update in miniature -->
  <rect x="461" y="40" width="250" height="110" rx="14" fill="#eef4fb" stroke="#0f6cbd" stroke-width="3"/>
  <text x="586" y="74" text-anchor="middle" font-size="22" font-weight="700" fill="#0f6cbd">2 DEPLOY</text>
  <rect x="496" y="88" width="26" height="26" rx="5" fill="#1f6feb"/>
  <rect x="528" y="88" width="26" height="26" rx="5" fill="#1f6feb"/>
  <rect x="560" y="88" width="26" height="26" rx="5" fill="#1a7f37"/>
  <text x="602" y="107" font-size="20" fill="#7a7a7a">→</text>
  <rect x="624" y="88" width="26" height="26" rx="5" fill="#1a7f37"/>
  <rect x="656" y="88" width="26" height="26" rx="5" fill="#1a7f37"/>
  <text x="586" y="138" text-anchor="middle" font-size="16" fill="#242424">one copy at a time</text>
  <line x1="711" y1="95" x2="749" y2="95" stroke="#7a7a7a" stroke-width="3" marker-end="url(#a)"/>

  <!-- 3 verify -->
  <rect x="754" y="40" width="210" height="110" rx="14" fill="#eef4fb" stroke="#0f6cbd" stroke-width="3"/>
  <text x="859" y="78" text-anchor="middle" font-size="22" font-weight="700" fill="#0f6cbd">3 VERIFY</text>
  <text x="859" y="106" text-anchor="middle" font-size="17" fill="#242424">all copies up?</text>
  <text x="859" y="128" text-anchor="middle" font-size="17" fill="#242424">site answers v2?</text>
  <line x1="964" y1="95" x2="1002" y2="95" stroke="#1a7f37" stroke-width="3" marker-end="url(#a)"/>

  <!-- released -->
  <rect x="1007" y="40" width="178" height="110" rx="14" fill="#1a7f37"/>
  <text x="1096" y="88" text-anchor="middle" font-size="22" font-weight="700" fill="#ffffff">released</text>
  <text x="1096" y="116" text-anchor="middle" font-size="17" fill="#d6efdc">users have v2</text>

  <!-- rollback branch -->
  <path d="M859 150 V 220 H 700" fill="none" stroke="#cf222e" stroke-width="3" stroke-dasharray="9 6" marker-end="url(#r)"/>
  <text x="872" y="196" font-size="17" font-weight="700" fill="#cf222e">no?</text>
  <rect x="425" y="185" width="270" height="72" rx="14" fill="#fdf0f0" stroke="#cf222e" stroke-width="3"/>
  <text x="560" y="216" text-anchor="middle" font-size="21" font-weight="700" fill="#cf222e">4 ROLLBACK</text>
  <text x="560" y="243" text-anchor="middle" font-size="16" fill="#242424">back to the last good version</text>

  <text x="600" y="305" text-anchor="middle" font-size="21" font-weight="700" fill="#0f6cbd">every change, the same way - by a machine, not by hand</text>
</svg>
