<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470" font-family="Segoe UI, Calibri, Carlito, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#242424"/>
    </marker>
  </defs>
  <rect width="1200" height="470" fill="#ffffff"/>

  <!-- laptop -->
  <rect x="15" y="15" width="1170" height="440" rx="18" fill="#f7f7f7" stroke="#7a7a7a" stroke-width="2"/>
  <text x="40" y="50" font-size="22" font-weight="700" fill="#7a7a7a">this laptop (Windows)</text>

  <!-- browser -->
  <rect x="40" y="185" width="190" height="120" rx="10" fill="#ffffff" stroke="#242424" stroke-width="2.5"/>
  <rect x="40" y="185" width="190" height="26" rx="10" fill="#e1e1e1"/>
  <circle cx="58" cy="198" r="5" fill="#cf222e"/><circle cx="74" cy="198" r="5" fill="#d97706"/><circle cx="90" cy="198" r="5" fill="#1a7f37"/>
  <text x="135" y="250" text-anchor="middle" font-size="20" font-weight="700" fill="#242424">browser</text>
  <text x="135" y="280" text-anchor="middle" font-size="17" fill="#0f6cbd" font-family="Consolas, Cascadia Mono, monospace">localhost:8080</text>

  <!-- WSL -->
  <rect x="265" y="70" width="900" height="370" rx="16" fill="#f3f7fc" stroke="#2b579a" stroke-width="2.5"/>
  <text x="290" y="104" font-size="21" font-weight="700" fill="#2b579a">WSL - Linux inside Windows</text>

  <!-- Docker -->
  <rect x="290" y="122" width="850" height="300" rx="14" fill="#ffffff" stroke="#0f6cbd" stroke-width="2.5" stroke-dasharray="10 6"/>
  <text x="312" y="155" font-size="20" font-weight="700" fill="#0f6cbd">Docker + kind</text>
  <text x="470" y="155" font-size="18" fill="#7a7a7a">- every "machine" of the cluster is a container</text>

  <line x1="230" y1="245" x2="318" y2="245" stroke="#242424" stroke-width="3" marker-end="url(#a)"/>

  <!-- control plane -->
  <rect x="322" y="178" width="240" height="196" rx="12" fill="#eef4fb" stroke="#2b579a" stroke-width="2.5"/>
  <text x="442" y="214" text-anchor="middle" font-size="21" font-weight="700" fill="#2b579a">control plane</text>
  <text x="442" y="242" text-anchor="middle" font-size="18" fill="#7a7a7a">the brain</text>
  <!-- a small "plan": which pod goes on which worker -->
  <rect x="372" y="262" width="140" height="74" rx="8" fill="#ffffff" stroke="#2b579a" stroke-width="2"/>
  <rect x="384" y="274" width="18" height="18" rx="3" fill="#1f6feb"/><text x="410" y="289" font-size="15" fill="#2b579a">→ worker 1</text>
  <rect x="384" y="306" width="18" height="18" rx="3" fill="#1f6feb"/><text x="410" y="321" font-size="15" fill="#2b579a">→ worker 2</text>
  <text x="442" y="362" text-anchor="middle" font-size="16" fill="#7a7a7a">decides what runs where</text>

  <!-- worker 1 -->
  <rect x="590" y="178" width="255" height="196" rx="12" fill="#ffffff" stroke="#242424" stroke-width="2.5"/>
  <text x="717" y="214" text-anchor="middle" font-size="21" font-weight="700" fill="#242424">worker 1</text>
  <rect x="617" y="250" width="92" height="64" rx="10" fill="#1f6feb"/>
  <text x="663" y="289" text-anchor="middle" font-size="19" fill="#ffffff">pod</text>
  <rect x="726" y="250" width="92" height="64" rx="10" fill="#1f6feb"/>
  <text x="772" y="289" text-anchor="middle" font-size="19" fill="#ffffff">pod</text>

  <!-- worker 2 -->
  <rect x="870" y="178" width="245" height="196" rx="12" fill="#ffffff" stroke="#242424" stroke-width="2.5"/>
  <text x="992" y="214" text-anchor="middle" font-size="21" font-weight="700" fill="#242424">worker 2</text>
  <rect x="946" y="250" width="92" height="64" rx="10" fill="#1f6feb"/>
  <text x="992" y="289" text-anchor="middle" font-size="19" fill="#ffffff">pod</text>

  <text x="852" y="404" text-anchor="middle" font-size="18" fill="#7a7a7a">3 copies (pods) of the web page, spread over 2 workers</text>
</svg>
