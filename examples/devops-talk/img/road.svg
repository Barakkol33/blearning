<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 70 1330 280" width="1330" height="280" font-family="Segoe UI, Calibri, Carlito, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#0f6cbd"/>
    </marker>
  </defs>
  <rect width="1330" height="350" fill="#ffffff"/>

  <!-- 1. the laptop, with the game on its screen -->
  <rect x="40" y="110" width="190" height="130" rx="10" fill="#242424"/>
  <rect x="52" y="122" width="166" height="106" rx="4" fill="#faf8ef"/>
  <rect x="88" y="130" width="94" height="90" rx="6" fill="#bbada0"/>
  <g fill="#cdc1b4">
    <rect x="94" y="136" width="18" height="16" rx="2"/><rect x="116" y="136" width="18" height="16" rx="2"/><rect x="138" y="136" width="18" height="16" rx="2"/><rect x="160" y="136" width="18" height="16" rx="2"/>
    <rect x="94" y="156" width="18" height="16" rx="2"/><rect x="138" y="156" width="18" height="16" rx="2"/><rect x="160" y="156" width="18" height="16" rx="2"/>
    <rect x="94" y="176" width="18" height="16" rx="2"/><rect x="116" y="176" width="18" height="16" rx="2"/><rect x="138" y="176" width="18" height="16" rx="2"/>
    <rect x="116" y="196" width="18" height="16" rx="2"/><rect x="138" y="196" width="18" height="16" rx="2"/><rect x="160" y="196" width="18" height="16" rx="2"/>
  </g>
  <rect x="116" y="156" width="18" height="16" rx="2" fill="#eee4da"/><text x="125" y="168" text-anchor="middle" font-size="11" font-weight="700" fill="#776e65">2</text>
  <rect x="160" y="176" width="18" height="16" rx="2" fill="#f2b179"/><text x="169" y="188" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">8</text>
  <rect x="94" y="196" width="18" height="16" rx="2" fill="#eee4da"/><text x="103" y="208" text-anchor="middle" font-size="11" font-weight="700" fill="#776e65">2</text>
  <path d="M20 240 L250 240 L262 258 L8 258 Z" fill="#7a7a7a"/>
  <text x="135" y="298" text-anchor="middle" font-size="24" font-weight="700" fill="#242424">your laptop</text>
  <text x="135" y="326" text-anchor="middle" font-size="18" fill="#7a7a7a">the code: main.py, board.py</text>

  <!-- arrow: git push -->
  <path d="M268 180 L352 180" stroke="#0f6cbd" stroke-width="5" marker-end="url(#a)"/>
  <text x="308" y="156" text-anchor="middle" font-size="18" font-family="Consolas, monospace" font-weight="700" fill="#242424">git push</text>

  <!-- 2. the repository -->
  <rect x="362" y="110" width="200" height="140" rx="14" fill="#242424"/>
  <text x="462" y="172" text-anchor="middle" font-size="26" font-weight="700" fill="#ffffff">GitHub</text>
  <text x="462" y="202" text-anchor="middle" font-size="16" fill="#d0d0d0">the code + its history</text>
  <text x="462" y="298" text-anchor="middle" font-size="24" font-weight="700" fill="#242424">a repository</text>
  <text x="462" y="326" text-anchor="middle" font-size="18" fill="#7a7a7a">every commit, saved</text>

  <!-- arrow: every push starts the pipeline -->
  <path d="M570 180 L632 180" stroke="#0f6cbd" stroke-width="5" marker-end="url(#a)"/>

  <!-- 3+4. the pipeline: build (a Docker image), test, deploy, verify -->
  <rect x="642" y="90" width="400" height="180" rx="14" fill="#f3f6fb" stroke="#0f6cbd" stroke-width="2"/>
  <text x="842" y="122" text-anchor="middle" font-size="22" font-weight="700" fill="#0f6cbd">CI/CD pipeline</text>
  <g font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">
    <path d="M656 140 L762 140 L776 162 L762 184 L656 184 Z" fill="#0f6cbd"/><text x="712" y="168">BUILD</text>
    <path d="M778 140 L884 140 L898 162 L884 184 L778 184 L792 162 Z" fill="#0f6cbd"/><text x="838" y="168">TEST</text>
    <path d="M900 140 L1028 140 L1028 184 L900 184 L914 162 Z" fill="#0f6cbd"/><text x="966" y="168">DEPLOY</text>
  </g>
  <!-- the Docker image that BUILD makes -->
  <path d="M700 186 L700 204" stroke="#2496ed" stroke-width="3" marker-end="url(#a)"/>
  <rect x="656" y="208" width="140" height="48" rx="6" fill="#2496ed"/>
  <path d="M672 208 L672 256 M688 208 L688 256 M704 208 L704 256" stroke="#ffffff" stroke-opacity="0.35" stroke-width="2"/>
  <text x="752" y="230" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Docker</text>
  <text x="752" y="248" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">image</text>
  <text x="842" y="298" text-anchor="middle" font-size="24" font-weight="700" fill="#242424">a pipeline</text>
  <text x="842" y="326" text-anchor="middle" font-size="18" fill="#7a7a7a">automatic, on every push</text>

  <!-- arrow: to production -->
  <path d="M1050 180 L1092 180" stroke="#0f6cbd" stroke-width="5" marker-end="url(#a)"/>

  <!-- 5. production: Kubernetes runs copies of the image -->
  <rect x="1102" y="90" width="190" height="180" rx="14" fill="#e8f1fb" stroke="#0f6cbd" stroke-width="2"/>
  <text x="1197" y="120" text-anchor="middle" font-size="22" font-weight="700" fill="#242424">production</text>
  <rect x="1122" y="164" width="150" height="56" rx="8" fill="#1f6feb"/><text x="1197" y="199" text-anchor="middle" font-size="20" font-weight="700" fill="#ffffff">the game</text>
  <text x="1197" y="298" text-anchor="middle" font-size="24" font-weight="700" fill="#242424">Kubernetes</text>

</svg>
