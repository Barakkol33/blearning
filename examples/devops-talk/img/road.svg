<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 70 1330 268" width="1330" height="268" font-family="Segoe UI, Calibri, Carlito, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#0f6cbd"/>
    </marker>
  </defs>
  <rect y="70" width="1330" height="268" fill="#ffffff"/>

  <!-- 1. the laptop, with the game on its screen -->
  <rect x="40" y="110" width="190" height="130" rx="10" fill="#242424"/>
  <rect x="52" y="122" width="166" height="106" rx="4" fill="#faf8ef"/>
  <rect x="88" y="130" width="94" height="90" rx="6" fill="#bbada0"/>
  <g fill="#cdc1b4">
    <rect x="94" y="136" width="18" height="16" rx="2"/><rect x="116" y="136" width="18" height="16" rx="2"/><rect x="138" y="136" width="18" height="16" rx="2"/><rect x="160" y="136" width="18" height="16" rx="2"/>
    <rect x="94" y="156" width="18" height="16" rx="2"/><rect x="138" y="156" width="18" height="16" rx="2"/><rect x="160" y="156" width="18" height="16" rx="2"/>
    <rect x="94" y="176" width="18" height="16" rx="2"/><rect x="116" y="176" width="18" height="16" rx="2"/><rect x="138" y="176" width="18" height="16" rx="2"/>
    <rect x="116" y="196" width="18" height="16" rx="2"/><rect x="138" y="196" width="18" height="16" rx="2"/><rect x="160" y="196" width="18" height="16" rx="2"/>
  </g>
  <rect x="116" y="156" width="18" height="16" rx="2" fill="#eee4da"/><text x="125" y="168" text-anchor="middle" font-size="11" font-weight="700" fill="#776e65">2</text>
  <rect x="160" y="176" width="18" height="16" rx="2" fill="#f2b179"/><text x="169" y="188" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">8</text>
  <rect x="94" y="196" width="18" height="16" rx="2" fill="#eee4da"/><text x="103" y="208" text-anchor="middle" font-size="11" font-weight="700" fill="#776e65">2</text>
  <path d="M20 240 L250 240 L262 258 L8 258 Z" fill="#7a7a7a"/>
  <text x="135" y="298" text-anchor="middle" font-size="24" font-weight="700" fill="#242424">your laptop</text>

  <!-- arrow: git push -->
  <path d="M268 180 L352 180" stroke="#0f6cbd" stroke-width="5" marker-end="url(#a)"/>
  <text x="308" y="156" text-anchor="middle" font-size="18" font-family="Consolas, monospace" font-weight="700" fill="#242424">git push</text>

  <!-- 2. GitHub -->
  <rect x="362" y="110" width="200" height="140" rx="14" fill="#242424"/>
  <!-- the files, as GitHub lists them -->
  <path d="M390 139 L398 139 L401 142 L412 142 L412 158 L390 158 Z" fill="#54aeff"/>
  <text x="424" y="154" font-size="19" font-family="Consolas, monospace" fill="#e6edf3">static/</text>
  <path d="M392 170 L404 170 L410 176 L410 192 L392 192 Z" fill="#d0d7de"/><path d="M404 170 L404 176 L410 176" fill="#8c959f"/>
  <text x="424" y="188" font-size="19" font-family="Consolas, monospace" fill="#e6edf3">board.py</text>
  <path d="M392 204 L404 204 L410 210 L410 226 L392 226 Z" fill="#d0d7de"/><path d="M404 204 L404 210 L410 210" fill="#8c959f"/>
  <text x="424" y="222" font-size="19" font-family="Consolas, monospace" fill="#e6edf3">main.py</text>
  <text x="462" y="298" text-anchor="middle" font-size="24" font-weight="700" fill="#242424">GitHub</text>

  <!-- arrow: every push starts the pipeline -->
  <path d="M570 180 L632 180" stroke="#0f6cbd" stroke-width="5" marker-end="url(#a)"/>

  <!-- 3. the pipeline: build (a Docker image), test, deploy -->
  <rect x="642" y="90" width="400" height="180" rx="14" fill="#f3f6fb" stroke="#0f6cbd" stroke-width="2"/>
  <g font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">
    <path d="M656 124 L762 124 L776 146 L762 168 L656 168 Z" fill="#0f6cbd"/><text x="712" y="152">BUILD</text>
    <path d="M778 124 L884 124 L898 146 L884 168 L778 168 L792 146 Z" fill="#0f6cbd"/><text x="838" y="152">TEST</text>
    <path d="M900 124 L1028 124 L1028 168 L900 168 L914 146 Z" fill="#0f6cbd"/><text x="966" y="152">DEPLOY</text>
  </g>
  <!-- the Docker image that BUILD makes -->
  <path d="M700 170 L700 186" stroke="#2496ed" stroke-width="3" marker-end="url(#a)"/>
  <rect x="656" y="190" width="140" height="48" rx="6" fill="#2496ed"/>
  <path d="M672 190 L672 238 M688 190 L688 238 M704 190 L704 238" stroke="#ffffff" stroke-opacity="0.35" stroke-width="2"/>
  <text x="752" y="212" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Docker</text>
  <text x="752" y="230" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">image</text>
  <text x="842" y="298" text-anchor="middle" font-size="24" font-weight="700" fill="#242424">CI/CD pipeline</text>

  <!-- arrow: to production -->
  <path d="M1050 180 L1092 180" stroke="#0f6cbd" stroke-width="5" marker-end="url(#a)"/>

  <!-- 4. production: Kubernetes runs the game -->
  <rect x="1102" y="90" width="190" height="180" rx="14" fill="#e8f1fb" stroke="#0f6cbd" stroke-width="2"/>
  <rect x="1122" y="152" width="150" height="56" rx="8" fill="#1f6feb"/><text x="1197" y="187" text-anchor="middle" font-size="20" font-weight="700" fill="#ffffff">the game</text>
  <text x="1197" y="298" text-anchor="middle" font-size="24" font-weight="700" fill="#242424">production</text>
  <text x="1197" y="324" text-anchor="middle" font-size="18" fill="#7a7a7a">Kubernetes</text>
</svg>
